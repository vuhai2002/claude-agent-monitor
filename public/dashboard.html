<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subagent monitor</title>
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/agent-card.css">
<script>
  // Runs before the first paint. The module script is deferred, so resolving the
  // theme there instead would show a flash of light before switching to dark.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
    var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = stored === 'dark' || stored === 'light' ? stored : system;
  }());
</script>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <span class="logo" id="logo" aria-hidden="true"></span>
      <h1>subagent<em>monitor</em></h1>
    </div>
    <div class="stats">
      <span class="stat">
        <span class="mark" id="mark" aria-hidden="true"></span>
        <b id="count-running">0</b> đang chạy
      </span>
      <span class="stat">
        <span class="stat-ico" id="total-ico" aria-hidden="true"></span>
        <b id="count-total">0</b> tổng
      </span>
      <button class="theme-btn" id="theme" type="button" aria-label="Đổi giao diện sáng tối"></button>
    </div>
  </header>

  <p class="alert" id="alert" hidden></p>

  <section class="idle" id="idle" hidden>
    <div class="idle-figure" id="idle-figure"></div>
    <h2 id="idle-title">không có subagent nào đang chạy</h2>
    <p id="idle-note">Tất cả subagent hiện tại đều đã hoàn thành.</p>
  </section>

  <section class="board" id="active-list"></section>

  <button class="toggle" id="toggle" type="button" hidden></button>

  <section class="board board-archive" id="done-list" hidden></section>
</div>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
